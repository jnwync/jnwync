<svg xmlns="http://www.w3.org/2000/svg" width="720" height="152" viewBox="0 0 720 152" role="img" aria-labelledby="title desc">
  <title id="title">From interface to release</title>
  <desc id="desc">A product engineering path from web and mobile interfaces through APIs and data to testing and release, with a feedback loop returning from release to the interface.</desc>
  <rect width="720" height="152" rx="10" fill="#151d19"/>

  <g fill="none" stroke="#46594d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 47H638"/>
    <path d="M622 126C581 145 139 145 98 126" stroke="#3f5147" stroke-dasharray="3 6"/>
  </g>
  <g fill="#151d19" stroke="#8bd5a8" stroke-width="2">
    <circle cx="104" cy="47" r="21"/>
    <circle cx="360" cy="47" r="21"/>
    <circle cx="616" cy="47" r="21"/>
  </g>

  <!-- Interface: paired web and mobile frames -->
  <g fill="none" stroke="#8bd5a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="39" width="17" height="13" rx="2"/>
    <path d="M92 43h17M98 52v3m5-3v3m-8 0h11"/>
    <rect x="113" y="40" width="7" height="14" rx="1.5"/>
    <path d="M116 51h1"/>
    <!-- API and data: connected service nodes -->
    <rect x="351" y="38" width="18" height="18" rx="4"/>
    <path d="M356 43h8m-8 4h8m-8 4h5M342 47h9m18 0h9m-29 0v-7m20 7v7"/>
    <circle cx="340" cy="47" r="2" fill="#8bd5a8" stroke="none"/>
    <circle cx="380" cy="47" r="2" fill="#8bd5a8" stroke="none"/>
    <circle cx="351" cy="38" r="2" fill="#8bd5a8" stroke="none"/>
    <circle cx="369" cy="56" r="2" fill="#8bd5a8" stroke="none"/>
    <!-- Test and release: verified build moving forward -->
    <path d="M607 41h12l7 7v7h-19z"/>
    <path d="M619 41v7h7m-16 1 3 3 6-7"/>
  </g>

  <g fill="#151d19" stroke="#8bd5a8" stroke-width="2">
    <path d="m227 43 5 4-5 4"/>
    <path d="m483 43 5 4-5 4"/>
    <path d="m102 123-5 4 5 4"/>
  </g>
  <g fill="#e4eee7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="550" letter-spacing="-0.4">
    <text x="104" y="94" text-anchor="middle">Web + mobile</text>
    <text x="360" y="94" text-anchor="middle">API + data</text>
    <text x="616" y="94" text-anchor="middle">Test + release</text>
  </g>
</svg>
