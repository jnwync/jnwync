<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" role="img" aria-labelledby="title desc">
  <title id="title">Bad-input field guide: Go on. Press it twice.</title>
  <desc id="desc">Two taps press a button; a gate lets one decision through.</desc>
  <style>
    .paper{fill:#f3efdf}.ink{fill:#20291f}.muted{fill:#596153}.rule{stroke:#c9c5b4}
    .serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Arial,Helvetica,sans-serif}
    .line{fill:none;stroke:#20291f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .coral{stroke:#d45e49;fill:none}.green{fill:#526d45}
    .kicker{font-size:21px;letter-spacing:1.5px}
    .compact-headline{display:none}
    @media(max-width:520px){
      .drawing,.kicker,.desktop-headline{display:none}
      .compact-headline{display:inline}
    }
  </style>
  <rect class="paper" width="840" height="290"/>
  <path d="M22 20h796M22 270h796" class="rule" stroke-width="1"/>
  <path d="M22 20v9M818 20v9M22 261v9M818 261v9" class="rule" stroke-width="1"/>

  <text x="42" y="57" class="sans muted kicker">BAD-INPUT FIELD GUIDE <tspan fill="#d45e49">/ 01</tspan></text>
  <g class="desktop-headline serif ink" font-size="63" font-weight="700" letter-spacing="-3.2">
    <text x="40" y="143">Go on.</text>
    <text x="40" y="221">Press it twice.</text>
  </g>
  <g class="compact-headline serif ink" font-size="100" font-weight="700" letter-spacing="-4" text-anchor="middle">
    <text x="420" y="119">Go on.</text>
    <text x="420" y="231">Press it twice.</text>
  </g>
  <path d="M42 244h380" class="rule" stroke-width="1"/>

  <g class="drawing">
    <path d="M475 42v193" class="rule" stroke-width="1"/>
    <path d="M505 91h43M505 119h43" class="coral" stroke-width="3" stroke-linecap="round"/>
    <path d="M540 85l9 6-9 6M540 113l9 6-9 6" class="coral" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="610" cy="105" r="47" fill="#e4dcc6" stroke="#20291f" stroke-width="2.5"/>
    <circle cx="610" cy="101" r="32" fill="#f3efdf" stroke="#d45e49" stroke-width="3"/>
    <circle cx="610" cy="101" r="20" fill="#d45e49"/>
    <path d="M577 151h66l-8 12h-50Z" fill="#20291f"/>
    <path d="M657 105h29m-8-8 9 8-9 8" class="line"/>

    <path d="M697 76v58m14-58v58" class="line"/>
    <path d="M711 105h25m-8-8 9 8-9 8" class="line"/>
    <circle cx="770" cy="105" r="29" class="green"/>
    <path d="M758 105h24" stroke="#f3efdf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="770" cy="105" r="6" fill="#f3efdf"/>
  </g>
</svg>
