<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Same action. Same receipt. Already did.</title>
  <desc id="desc">The same Split command, tap-1, approaches one receipt from both sides. The receipt has one accepted Split stamp and folded arms. It answers: Already did. This cartoon illustrates duplicate delivery, not two separate decisions.</desc>
