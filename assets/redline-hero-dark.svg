<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">jnwync. Made to click.</title>
  <desc id="desc">Original geometric lettering for Jon Wayne Cabusbusan. A red outline briefly converges into the final period, echoing two inputs becoming one decision.</desc>
  <style>
    .echo { transform-box:fill-box;transform-origin:center;animation:converge 2.4s cubic-bezier(.22,.61,.36,1) 1 both; }
    @keyframes converge { 0%,10% {transform:translate(-68px,-44px) scale(1.4);opacity:0} 30% {opacity:.7} 80%,100% {transform:translate(0,0) scale(1);opacity:0} }
    @media (prefers-reduced-motion:reduce) { .echo {display:none;animation:none} }
    @media (max-width:520px) { .identity {display:none} .caption {font-size:88px} }
  </style>
  <rect width="1200" height="560" fill="#1B1D19"/>
  <text class="identity" x="44" y="61" fill="#F0EFE9" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="29" letter-spacing="1.2">JON WAYNE CABUSBUSAN</text>
  <path d="M1058 39h98v29" stroke="#FF7052" stroke-width="4" fill="none"/>
  <g transform="translate(34 94)" fill="none" stroke="#F0EFE9" stroke-width="40" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M70 92v134q0 44-48 44"/>
    <path d="M160 226V104m0 50c0-66 122-66 122 0v72"/>
    <path d="m340 104 30 122 40-76 40 76 30-122"/>
    <path d="m538 104 52 94m52-94-52 94-20 56q-17 24-47 12"/>
    <path d="M714 226V104m0 50c0-66 122-66 122 0v72"/>
    <path d="M1008 116c-28-28-103-30-103 50 0 76 75 86 103 50"/>
  </g>
  <circle cx="104" cy="130" r="20" fill="#F0EFE9"/>
  <circle cx="1116" cy="320" r="22" fill="#FF7052"/>
  <circle class="echo" cx="1116" cy="320" r="22" stroke="#FF7052" stroke-width="4" fill="none"/>
  <path d="M44 411h1112" stroke="#F0EFE9" stroke-width="2"/>
  <text class="caption" x="43" y="513" fill="#F0EFE9" font-family="Trebuchet MS,DejaVu Sans,sans-serif" font-size="84" font-weight="700" letter-spacing="-4">Made to click.</text>
  <path d="M1025 468h122m-45-39 45 39-45 39" stroke="#FF7052" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
</svg>
